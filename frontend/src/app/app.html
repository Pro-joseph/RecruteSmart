@if (auth.user(); as u) {
  <nav>
    <a routerLink="/app/offers" routerLinkActive="active">Offres</a>
    <a routerLink="/app/forwards" routerLinkActive="active">Transferts</a>
    <a routerLink="/app/settings" routerLinkActive="active">Paramètres</a>
    @if (u.is_admin) {
      <a routerLink="/app/admin" routerLinkActive="active">Administration</a>
    }
    <span class="spacer"></span>
    <span class="who" (click)="onNameTap()" title="{{ u.name }}">{{ u.name }}</span>
    <button type="button" class="btn btn-ghost" (click)="logout()">Déconnexion</button>
  </nav>
} @else {
  <nav>
    <a routerLink="/login" routerLinkActive="active">Connexion</a>
    <a routerLink="/register" routerLinkActive="active">Créer un compte</a>
  </nav>
}
<main>
  <router-outlet />
</main>

@if (celebrate()) {
  <app-celebration (finished)="celebrate.set(false)" />
}
